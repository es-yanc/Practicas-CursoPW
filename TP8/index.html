<!DOCTYPE html>
<html lang="es-AR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes en HTML</title>
    <link rel="stylesheet" href="css/trabajo8.css">

</head>

<body>
    <div class="contenedor">
        <h1>Imagen jpg</h1>
        <img src="imágenes/foto01.jpg" alt="imagen en jpg">
        <h1>Gif animado</h1>
        <img src="imágenes/loading.gif" alt="Gif animado">
        <h1>Imagen PNG</h1>
        <img src="imágenes/CFL 2022 V3.png" alt="imagen PNG">
        <h1>Imagen SVG</h1>
        <img src="imágenes/blackcat.png" alt="imagen SVG">
    </div>
    <div class="contenedor" id="filtros">
        <h1>Filtro de imagenes</h1>
        <img src="imágenes/foto01.jpg" alt="foto de ejemplo" id="filtro1">
        <img src="imágenes/foto01.jpg" alt="foto de ejemplo" id="filtro2">
        <img src="imágenes/foto01.jpg" alt="foto de ejemplo" id="filtro3">
        <img src="imágenes/foto01.jpg" alt="foto de ejemplo" id="filtro4">
        <img src="imágenes/foto01.jpg" alt="foto de ejemplo" id="filtro5">
    </div>
    <div class="contenedor" id="galeria">
        <img src="imágenes/perro.png" alt="imagen de perro">
        <img src="imágenes/perro.png" alt="imagen de perro">
        <img src="imágenes/perro.png" alt="imagen de perro">
        <img src="imágenes/perro.png" alt="imagen de perro">
        <img src="imágenes/perro.png" alt="imagen de perro">
        <img src="imágenes/perro.png" alt="imagen de perro">
    </div>
</body>

</html>
